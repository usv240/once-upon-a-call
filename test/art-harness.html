<!DOCTYPE html>
<meta charset="utf-8" />
<title>Storybook art harness</title>
<link rel="icon" href="data:," />
<body style="margin:0;background:#111">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js" } }
</script>
<script type="module">
  import { Storybook } from '/Storybook.js';
  window.__ready = false;
  window.__renderStory = async (id) => {
    const story = await (await fetch('/api/story?id=' + id)).json();
    const book = new Storybook(story);
    const out = [];
    for (let i = 0; i < story.pages.length; i++) {
      book.setPage(i);
      // exercise every effect this page can fire, plus the animation loop
      for (const fx of Object.values(story.pages[i].keywords || {})) book.trigger(fx, 5);
      book.trigger('roar', 5);
      book.highlightUpTo(3);
      book.setCaption('checking the caption strip');
      book.setBanner('checking the banner');
      for (let f = 0; f < 6; f++) book.update(1 / 30);
      const c = book.canvas.getContext('2d');
      const d = c.getImageData(0, 0, book.canvas.width, book.canvas.height).data;
      // how much of the illustration half is non-paper? blank art would be ~0
      let ink = 0;
      for (let px = 0; px < d.length; px += 4 * 97) {
        if (d[px + 3] > 10 && !(d[px] > 240 && d[px + 1] > 235 && d[px + 2] > 215)) ink++;
      }
      out.push({ page: i + 1, scene: story.pages[i].scene, inkSamples: ink });
    }
    return { id, character: story.character, title: story.title, pages: out };
  };

  // Does pressing 1 / 2 / 3 actually change the picture on this page? Renders the page clean,
  // then with one keypad effect held, and reports how many sampled pixels differ.
  window.__effectDiff = async (id) => {
    const story = await (await fetch('/api/story?id=' + id)).json();
    const book = new Storybook(story);
    const MAP = { roar: 'roar', twinkle: 'stars-twinkle', hum: 'moon-smile' };
    const snap = () => {
      const c = book.canvas.getContext('2d');
      return c.getImageData(0, 0, book.canvas.width, book.canvas.height).data;
    };
    const diff = (a, b) => {
      let n = 0;
      for (let i = 0; i < a.length; i += 4 * 53) if (Math.abs(a[i] - b[i]) > 8) n++;
      return n;
    };
    const out = [];
    for (let i = 0; i < story.pages.length; i++) {
      for (const [key, fx] of Object.entries(story.effects || {})) {
        book.setPage(i);
        book.time = 3.0;             // fixed clock so idle animation cannot masquerade as a change
        book.draw();
        const before = snap();
        book.trigger(MAP[fx.sound] || 'hero-wiggle', 5);
        book.time = 3.0;
        book.draw();
        out.push({ page: i + 1, scene: story.pages[i].scene, key, label: fx.label, changed: diff(before, snap()) });
      }
    }
    return { id, results: out };
  };
  window.__ready = true;
</script>
